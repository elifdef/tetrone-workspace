x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    image: tetrone-backend:prod
    container_name: tetrone_backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    ports:
      - "81:8000"
    volumes:
      - backend-storage:/var/www/storage/app
      - ./tetrone-backend/storage/logs:/var/www/storage/logs
      - ./.env:/var/www/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - elifdefinternal

  queue:
    image: tetrone-backend:prod
    container_name: tetrone_queue
    user: www-data
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    volumes:
      - backend-storage:/var/www/storage/app
      - ./tetrone-backend/storage/logs:/var/www/storage/logs
      - ./.env:/var/www/.env:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    networks:
      - elifdefinternal

  schedule:
    image: tetrone-backend:prod
    container_name: tetrone_schedule
    user: www-data
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    volumes:
      - backend-storage:/var/www/storage/app
      - ./tetrone-backend/storage/logs:/var/www/storage/logs
      - ./.env:/var/www/.env:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work
    networks:
      - elifdefinternal

  socket:
    build:
      context: ./tetrone-websockets
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_websocket
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      - PORT=${WS_PORT:-3000}
    ports:
      - "82:${WS_PORT:-3000}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - elifdefinternal

  frontend:
    build:
      context: ./tetrone-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_MAX_FILE_SIZE_KB: ${MAX_FILE_SIZE_KB}
        VITE_APP_ENV: production
    container_name: tetrone_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - backend-storage:/var/www/storage/app:ro
    depends_on:
      - backend
    networks:
      - elifdefinternal

  db:
    image: postgres:18-alpine
    container_name: tetrone_postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-tetrone}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - elifdefinternal

  redis:
    image: redis:8.2-alpine
    container_name: tetrone_redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - elifdefinternal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: tetrone_elasticsearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elifdefinternal

volumes:
  pgsql-data:
  redis-data:
  elasticsearch-data:
  backend-storage:

networks:
  elifdefinternal:
    driver: bridge