services:
  backend:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_backend
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - db
      - redis
      - elasticsearch

  queue:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_queue
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - backend
      - db
      - redis
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3

  schedule:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_schedule
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - backend
      - db
      - redis
    command: php artisan schedule:work

  socket:
    build:
      context: ./tetrone-websockets
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_websocket
    restart: unless-stopped
    env_file:
      - ./tetrone-websockets/.env
      - ./.env
    environment:
      - PORT=${WS_PORT:-3000}
    ports:
      - "127.0.0.1:${WS_PORT:-3000}:${WS_PORT:-3000}"

  frontend:
    build:
      context: ./tetrone-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_MAX_FILE_SIZE_KB: ${MAX_FILE_SIZE_KB}
        VITE_APP_ENV: production
    container_name: tetrone_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    container_name: tetrone_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    container_name: tetrone_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: tetrone_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  pgsql-data:
  redis-data:
  elasticsearch-data: