services:
  backend:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_backend
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    ports:
      - "81:8000"
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - db
      - redis
      - elasticsearch
    networks:
      - elifdefinternal

  queue:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_queue
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - backend
      - db
      - redis
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    networks:
      - elifdefinternal

  schedule:
    build:
      context: ./tetrone-backend
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_schedule
    restart: unless-stopped
    env_file:
      - ./tetrone-backend/.env
      - ./.env
    volumes:
      - ./tetrone-backend/storage:/var/www/storage
    depends_on:
      - backend
      - db
      - redis
    command: php artisan schedule:work
    networks:
      - elifdefinternal


  socket:
    build:
      context: ./tetrone-websockets
      dockerfile: Dockerfile
      target: prod
    container_name: tetrone_websocket
    restart: unless-stopped
    env_file:
      - ./tetrone-websockets/.env
      - ./.env
    environment:
      - PORT=${WS_PORT:-3000}
    ports:
      - "82:${WS_PORT:-3000}"
    networks:
      - elifdefinternal

  frontend:
    build:
      context: ./tetrone-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_MAX_FILE_SIZE_KB: ${MAX_FILE_SIZE_KB}
        VITE_APP_ENV: production
    container_name: tetrone_frontend
    restart: unless-stopped
    env_file:
      - ./tetrone-frontend/.env
      - ./.env
    ports:
      - "80:80"
    networks:
      - elifdefinternal
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    container_name: tetrone_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - elifdefinternal
    volumes:
      - pgsql-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    container_name: tetrone_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - elifdefinternal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: tetrone_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    networks:
      - elifdefinternal
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  pgsql-data:
  redis-data:
  elasticsearch-data:

networks:
  elifdefinternal:
    driver: bridge
